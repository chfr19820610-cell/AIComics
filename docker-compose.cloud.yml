# AIComics Cloud Edition — no ComfyUI, no local models
# Usage: docker-compose -f docker-compose.cloud.yml up
services:
  aicomic-cloud:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    ports:
      - "7860:7860"
    environment:
      - AICOMIC_CLOUD=1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SEEDANCE_API_KEY=${SEEDANCE_API_KEY:-}
    command: >
      sh -lc "python -m uvicorn main:app --host 0.0.0.0 --port 7860"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
