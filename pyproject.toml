[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomic-system"
version = "5.2.0"
description = "AI漫剧自动生成系统 MVP 骨架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
web = []
validation = [
    "imageio>=2.37,<3",
    "imageio-ffmpeg>=0.6,<1",
    "numpy>=2,<3",
    "pillow>=13,<14",
    "pip-audit>=2.10,<3",
    "websocket-client>=1.9,<2",
]
local-providers = [
    "piper-tts==1.4.2",
]
# 中文 TTS：piper 的 zh_CN 语音走 PINYIN 音素类型，需要 g2pw 做多音字消歧，
# 而 g2pw 通过 transformers 加载 BERT，间接需要 torch。
# 单独成一个 extra，避免所有安装者都被拉进 ~1GB 的 torch。
local-tts-zh = [
    "piper-tts==1.4.2",
    "g2pw>=0.1.2,<1",
    "unicode-rbnf>=2.4,<3",
    "sentence-stream>=1.4,<2",
    "transformers>=4,<6",
    "torch>=2,<3",
]
cloud = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
]
# v5.0: i18n LLM translation + multilang TTS + publish
i18n = [
    "openai>=1.0,<2",
]
tts = [
    "edge-tts>=6.1,<7",
]
publish = [
    "google-api-python-client>=2.154,<3",
    "google-auth-oauthlib>=1.2,<2",
    "selenium>=4.20,<5",
]

[project.scripts]
aicomic = "aicomic.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
